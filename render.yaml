# Render Blueprint — BDS LeadFlow (web + Background Worker + PostgreSQL, всичко във frankfurt).
# Проверено локално срещу официалната JSON schema https://render.com/schema/render.yaml.json (виж docs/RENDER-SETUP.md).
# В този етап НЕ е създаден нито един Render ресурс. Плановете са платени: web/worker 0.5c-512mb, база 0.1c-256mb
# (preDeployCommand изисква платена услуга; безплатната база изтича).
#
# Тайни и стойности, известни едва при създаването: само `sync: false` НА НИВО УСЛУГА — Render ги пита при първото
# създаване на Blueprint-а; стойностите не са в Git. В envVarGroups `sync: false` НЕ се поддържа (Render го игнорира),
# затова групата `leadflow-shared` съдържа само фиксирани `value` (scripts/validate-render-yaml.mjs отказва друго).
# APP_BASE_URL и NEXT_PUBLIC_VAPID_PUBLIC_KEY са декларирани поотделно в web и worker: при създаването въведи
# ЕДНАКВА стойност в двете услуги (и при всяка следваща смяна — в двете).
# Не използвай `generateValue` за общи тайни: всяка услуга би получила РАЗЛИЧНА генерирана стойност.
#
# Production gates (SCHEDULER_ENABLED, DELIVERIES_ENABLED) са "false" до проверен cutover — docs/CUTOVER-AND-ROLLBACK.md.

envVarGroups:
  - name: leadflow-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_MODE
        value: real
      - key: DELIVERIES_ENABLED
        value: "false"
      - key: NOTIFY_DRY_RUN
        value: "false"
      - key: WORKER_STALE_SECONDS
        value: "180"

services:
  - type: web
    name: bds-leadflow-web
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    branch: main
    # Node версията идва от .node-version (24.21.0). devDependencies са нужни за next build (TypeScript, Tailwind).
    buildCommand: npm ci --include=dev && npm run build
    # Една стъпка за schema миграциите преди новата версия да поеме трафика (само migrate deploy; никога dev/reset, никога CRM данни).
    preDeployCommand: npm run db:deploy
    # exec + директно node (без npm): shell-ът се заменя с node и SIGTERM от Render стига до процеса, който го предава
    # на next start (npm и dash `sh -c` без exec умират от сигнала — проверено в CI на Linux).
    startCommand: exec node scripts/start-web.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - fromGroup: leadflow-shared
      - key: DATABASE_URL
        fromDatabase:
          name: bds-leadflow-db
          property: connectionString
      # Canonical HTTPS адрес (само origin, без път), напр. https://bds-leadflow-web.onrender.com или собствен домейн.
      # Задължителен за старт (production отказва без https). ЕДНАКЪВ с APP_BASE_URL на worker-а.
      - key: APP_BASE_URL
        sync: false
      # Публичен по предназначение VAPID ключ (абониране в браузъра). ЕДНАКЪВ с този на worker-а.
      # Не е нужен за първи старт — може да се остави празен и да се добави при настройването на известията.
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      # Render добавя точно един X-Forwarded-For hop пред услугата.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: SESSION_TTL_HOURS
        value: "168"
      # Допълнителни разрешени Origin стойности (напр. собствен домейн + onrender адреса), CSV; празно = само APP_BASE_URL.
      - key: ALLOWED_ORIGINS
        sync: false
      # Една реална тестова доставка от Настройки (неутрален текст) — включва се за кратко при live теста.
      - key: ALLOW_REAL_TEST_DELIVERY
        value: "false"

  - type: worker
    name: bds-leadflow-worker
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    branch: main
    # tsx (devDependency) изпълнява worker-а; Prisma клиентите се генерират в postinstall.
    buildCommand: npm ci --include=dev
    # exec + директно node (без npm/tsx CLI обвивки): SIGTERM стига до worker-а → чисто спиране (тест в CI на Linux).
    startCommand: exec node --import tsx src/worker/index.ts
    autoDeployTrigger: checksPass
    # Worker-ът изчаква текущия tick до 25 s и освобождава lease-овете.
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: leadflow-shared
      - key: DATABASE_URL
        fromDatabase:
          name: bds-leadflow-db
          property: connectionString
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: WORKER_TICK_SECONDS
        value: "30"
      # ЕДНАКЪВ с APP_BASE_URL на web (линкове в имейла). Задължителен за старт.
      - key: APP_BASE_URL
        sync: false
      # ЕДНАКЪВ с публичния ключ на web (изпращане към абонаментите). Не е нужен за първи старт.
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      # Следващите са за известията — не са нужни за първи старт (DELIVERIES_ENABLED=false); могат да останат празни.
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: OWNER_NOTIFY_EMAIL
        sync: false

databases:
  - name: bds-leadflow-db
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: bds_leadflow
    user: bds_leadflow
    diskSizeGB: 5
    # Само вътрешни връзки от услугите. За еднократния импорт при cutover временно се добавя твоят IP (docs/CUTOVER-AND-ROLLBACK.md).
    ipAllowList: []
